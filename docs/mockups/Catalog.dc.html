<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Catálogo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Sora:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0E1014}
a{color:#F2A93B}a:hover{color:#FFC56B}
.nav{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:10px;color:#C9CED8;text-decoration:none;font-size:15px}
.nav:hover{background:#1E222B;color:#ECEEF2}
.nav-on{background:#2A2418;color:#F2A93B}
.card{text-decoration:none;color:#ECEEF2;display:flex;flex-direction:column;gap:10px}
.card:hover .poster{outline:2px solid #F2A93B;outline-offset:2px}
input:focus,button:focus-visible,a:focus-visible{outline:2px solid #F2A93B;outline-offset:2px}
</style>
</helmet>
<div style="min-height: 100vh; display: flex; flex-wrap: wrap; background: #0E1014; color: #ECEEF2; font-family: Inter, system-ui, sans-serif">
  <nav aria-label="Principal" style="flex: 1 1 220px; max-width: 100%; box-sizing: border-box; padding: 24px 16px; background: #161920; border-right: 1px solid #2B303B; display: flex; flex-direction: column; gap: 6px">
    <div style="display: flex; align-items: center; gap: 10px; padding: 0 12px 20px">
      <div style="width: 32px; height: 32px; border-radius: 8px; background: #F2A93B; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1B1306" stroke-width="2.5" stroke-linejoin="round"><polygon points="7 4 20 12 7 20 7 4"></polygon></svg></div>
      <span style="font-family: Sora, sans-serif; font-weight: 700; font-size: 16px">MultimediaServer</span>
    </div>
    <a href="Catalog.dc.html" class="nav nav-on" aria-current="page"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect></svg>Catálogo</a>
    <a href="Profile.dc.html" class="nav"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 4-6 8-6s8 2 8 6"></path></svg>Mi cuenta</a>
    <sc-if value="{{isAdmin}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; gap: 6px; margin-top: 18px">
        <span style="padding: 0 12px 4px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #A3ABB9">Administración</span>
        <a href="AdminCatalog.dc.html" class="nav"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"></rect><path d="M7 4v16M17 4v16M2 12h20"></path></svg>Contenido</a>
        <a href="MultimediaAdmin.dc.html" class="nav"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M6 10l6-6 6 6"></path><path d="M4 20h16"></path></svg>Episodios y vídeo</a>
        <a href="Genres.dc.html" class="nav"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12l-8 8-9-9V3h8z"></path><circle cx="7.5" cy="7.5" r="1.5"></circle></svg>Géneros</a>
        <a href="Users.dc.html" class="nav"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="4"></circle><path d="M2 21c0-4 3-6 7-6s7 2 7 6"></path><path d="M16 4a4 4 0 0 1 0 8M22 21c0-3-2-5-4-6"></path></svg>Usuarios</a>
      </div>
    </sc-if>
    <div style="flex: 1"></div>
    <div style="display: flex; align-items: center; gap: 10px; padding: 12px; border-top: 1px solid #2B303B; margin-top: 16px">
      <div style="width: 36px; height: 36px; border-radius: 50%; background: #1E222B; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px">{{initial}}</div>
      <div style="display: flex; flex-direction: column; min-width: 0; flex: 1">
        <span style="font-size: 14px; font-weight: 600">{{username}}</span>
        <span style="font-size: 12px; color: #A3ABB9">{{role}}</span>
      </div>
      <a href="Main.dc.html" aria-label="Cerrar sesión" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 10px; color: #A3ABB9"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="M16 17l5-5-5-5M21 12H9"></path></svg></a>
    </div>
  </nav>
  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 32px 40px 56px; display: flex; flex-direction: column; gap: 28px">
    <header style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <h1 style="margin: 0; font-family: Sora, sans-serif; font-size: 32px">Catálogo</h1>
        <p style="margin: 0; color: #A3ABB9; font-size: 15px">Películas y series disponibles en el servidor.</p>
      </div>
      <sc-if value="{{isAdmin}}" hint-placeholder-val="{{ false }}">
        <a href="MovieForm.dc.html" style="height: 44px; padding: 0 18px; border-radius: 10px; background: #F2A93B; color: #1B1306; font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 8px; text-decoration: none"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>Nueva película o serie</a>
      </sc-if>
    </header>
    <div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center">
      <div style="flex: 1 1 320px; position: relative; max-width: 520px">
        <label for="search" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Buscar por nombre</label>
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A3ABB9" stroke-width="2" stroke-linecap="round" style="position: absolute; left: 14px; top: 13px"><circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4.3-4.3"></path></svg>
        <input id="search" type="search" placeholder="Buscar por nombre…" style="width: 100%; height: 44px; box-sizing: border-box; padding: 0 14px 0 42px; border-radius: 10px; border: 1px solid #2B303B; background: #161920; color: #ECEEF2; font-size: 15px; font-family: inherit">
      </div>
      <div role="group" aria-label="Tipo" style="display: flex; gap: 6px; padding: 4px; background: #161920; border: 1px solid #2B303B; border-radius: 10px">
        <button type="button" style="height: 36px; padding: 0 14px; border-radius: 7px; border: 0; background: #2A2418; color: #F2A93B; font-weight: 600; font-size: 14px; font-family: inherit">Todo</button>
        <button type="button" style="height: 36px; padding: 0 14px; border-radius: 7px; border: 0; background: transparent; color: #C9CED8; font-size: 14px; font-family: inherit">Películas</button>
        <button type="button" style="height: 36px; padding: 0 14px; border-radius: 7px; border: 0; background: transparent; color: #C9CED8; font-size: 14px; font-family: inherit">Series</button>
      </div>
    </div>
    <div role="group" aria-label="Géneros" style="display: flex; flex-wrap: wrap; gap: 8px">
      <sc-for list="{{genres}}" as="g" hint-placeholder-count="6">
        <button type="button" style="{{g.style}}">{{g.name}}</button>
      </sc-for>
    </div>
    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 28px 20px">
      <sc-for list="{{items}}" as="it" hint-placeholder-count="10">
        <a href="Detail.dc.html" class="card">
          <div class="poster" style="{{it.poster}}">
            <span style="align-self: flex-start; padding: 3px 8px; border-radius: 6px; background: rgba(14,16,20,0.75); font-size: 11px; font-weight: 600; letter-spacing: 0.04em">{{it.type}}</span>
            <span style="font-family: Sora, sans-serif; font-weight: 700; font-size: 18px; line-height: 1.2">{{it.name}}</span>
          </div>
          <div style="display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 15px; font-weight: 600">{{it.name}}</span>
            <span style="font-size: 13px; color: #A3ABB9">{{it.meta}}</span>
          </div>
        </a>
      </sc-for>
    </div>
    <nav aria-label="Paginación" style="display: flex; justify-content: center; gap: 8px">
      <button type="button" aria-label="Página anterior" style="width: 44px; height: 44px; border-radius: 10px; border: 1px solid #2B303B; background: #161920; color: #ECEEF2; font-size: 16px">‹</button>
      <button type="button" aria-current="page" style="width: 44px; height: 44px; border-radius: 10px; border: 0; background: #F2A93B; color: #1B1306; font-weight: 600; font-family: inherit">1</button>
      <button type="button" style="width: 44px; height: 44px; border-radius: 10px; border: 1px solid #2B303B; background: #161920; color: #ECEEF2; font-family: inherit">2</button>
      <button type="button" aria-label="Página siguiente" style="width: 44px; height: 44px; border-radius: 10px; border: 1px solid #2B303B; background: #161920; color: #ECEEF2; font-size: 16px">›</button>
    </nav>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"role":{"editor":"enum","options":["USER","ADMIN"],"default":"USER"},"$preview":{"width":1440,"height":1150}}'>
class Component extends DCLogic {
  renderVals() {
    const role = this.props.role ?? 'USER';
    const isAdmin = role === 'ADMIN';
    const tones = ['#3A2F4F', '#24414A', '#4A3326', '#2E3F2C', '#41283A', '#2B3550', '#4A4026', '#253B3B', '#3E2A2A', '#2F2F45'];
    const base = 'aspect-ratio: 2 / 3; border-radius: 12px; padding: 14px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; border: 1px solid rgba(255,255,255,0.06); background: ';
    const data = [
      ['La ruta del norte', 'SERIE', '2024 · 3 temporadas · Drama'],
      ['Marea baja', 'MOVIE', '2021 · Thriller'],
      ['Los últimos faros', 'SERIE', '2023 · 2 temporadas · Misterio'],
      ['Ciudad de papel', 'MOVIE', '2019 · Comedia'],
      ['Órbita', 'MOVIE', '2022 · Ciencia ficción'],
      ['Casa Valdés', 'SERIE', '2020 · 4 temporadas · Drama'],
      ['El silencio del bosque', 'MOVIE', '2018 · Terror'],
      ['Señales', 'SERIE', '2025 · 1 temporada · Ciencia ficción'],
      ['Verano en Cádiz', 'MOVIE', '2023 · Romance'],
      ['Crónicas del puerto', 'SERIE', '2017 · 5 temporadas · Policíaco']
    ];
    const items = data.map((d, i) => ({ name: d[0], type: d[1] === 'MOVIE' ? 'PELÍCULA' : 'SERIE', meta: d[2], poster: base + tones[i % tones.length] }));
    const chip = 'height: 36px; padding: 0 14px; border-radius: 999px; font-size: 14px; font-family: inherit; ';
    const genres = ['Todos', 'Drama', 'Comedia', 'Thriller', 'Ciencia ficción', 'Terror', 'Misterio', 'Romance'].map((name, i) => ({
      name,
      style: chip + (i === 0 ? 'border: 1px solid #F2A93B; background: #2A2418; color: #F2A93B; font-weight: 600' : 'border: 1px solid #2B303B; background: transparent; color: #C9CED8')
    }));
    return { role, isAdmin, items, genres, username: isAdmin ? 'admin' : 'ana', initial: isAdmin ? 'A' : 'AN' };
  }
}
</script>
</body>
</html>
