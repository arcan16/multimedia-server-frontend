<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Administración · Géneros</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Sora:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0E1014}
a{color:#F2A93B}a:hover{color:#FFC56B}
.nav{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:10px;color:#C9CED8;text-decoration:none;font-size:15px}
.nav:hover{background:#1E222B;color:#ECEEF2}
.nav-on{background:#2A2418;color:#F2A93B}
.ib{width:40px;height:40px;border-radius:9px;border:0;background:transparent;color:#C9CED8;display:inline-flex;align-items:center;justify-content:center}
.ib:hover{background:#1E222B;color:#ECEEF2}
.row{display:flex;align-items:center;gap:12px;min-height:56px;padding:6px 10px 6px 18px;border-bottom:1px solid #2B303B}
input:focus,button:focus-visible,a:focus-visible{outline:2px solid #F2A93B;outline-offset:2px}
</style>
</helmet>
<div style="min-height: 100vh; display: flex; flex-wrap: wrap; background: #0E1014; color: #ECEEF2; font-family: Inter, system-ui, sans-serif">
  <nav aria-label="Principal" style="flex: 1 1 220px; max-width: 100%; box-sizing: border-box; padding: 24px 16px; background: #161920; border-right: 1px solid #2B303B; display: flex; flex-direction: column; gap: 6px">
    <div style="display: flex; align-items: center; gap: 10px; padding: 0 12px 20px">
      <div style="width: 32px; height: 32px; border-radius: 8px; background: #F2A93B; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1B1306" stroke-width="2.5" stroke-linejoin="round"><polygon points="7 4 20 12 7 20 7 4"></polygon></svg></div>
      <span style="font-family: Sora, sans-serif; font-weight: 700; font-size: 16px">MultimediaServer</span>
    </div>
    <a href="Catalog.dc.html" class="nav"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect></svg>Catálogo</a>
    <a href="Profile.dc.html" class="nav"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 4-6 8-6s8 2 8 6"></path></svg>Mi cuenta</a>
    <div style="display: flex; flex-direction: column; gap: 6px; margin-top: 18px">
      <span style="padding: 0 12px 4px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #A3ABB9">Administración</span>
      <a href="AdminCatalog.dc.html" class="nav"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"></rect><path d="M7 4v16M17 4v16M2 12h20"></path></svg>Contenido</a>
      <a href="MultimediaAdmin.dc.html" class="nav"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M6 10l6-6 6 6"></path><path d="M4 20h16"></path></svg>Episodios y vídeo</a>
      <a href="Genres.dc.html" class="nav nav-on" aria-current="page"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12l-8 8-9-9V3h8z"></path><circle cx="7.5" cy="7.5" r="1.5"></circle></svg>Géneros</a>
      <a href="Users.dc.html" class="nav"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="4"></circle><path d="M2 21c0-4 3-6 7-6s7 2 7 6"></path><path d="M16 4a4 4 0 0 1 0 8M22 21c0-3-2-5-4-6"></path></svg>Usuarios</a>
    </div>
    <div style="flex: 1"></div>
    <div style="display: flex; align-items: center; gap: 10px; padding: 12px; border-top: 1px solid #2B303B; margin-top: 16px">
      <div style="width: 36px; height: 36px; border-radius: 50%; background: #1E222B; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px">A</div>
      <div style="display: flex; flex-direction: column; min-width: 0; flex: 1">
        <span style="font-size: 14px; font-weight: 600">admin</span>
        <span style="font-size: 12px; color: #A3ABB9">ADMIN</span>
      </div>
      <a href="Main.dc.html" aria-label="Cerrar sesión" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 10px; color: #A3ABB9"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="M16 17l5-5-5-5M21 12H9"></path></svg></a>
    </div>
  </nav>
  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 32px 40px 56px; display: flex; flex-direction: column; gap: 24px; max-width: 860px">
    <header style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-family: Sora, sans-serif; font-size: 32px">Géneros</h1>
      <p style="margin: 0; color: #A3ABB9; font-size: 15px">Los géneros con los que se clasifican películas y series.</p>
    </header>
    <form style="display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end">
      <div style="flex: 1 1 260px; display: flex; flex-direction: column; gap: 8px">
        <label for="g-new" style="font-size: 14px; font-weight: 500">Nuevo género</label>
        <input id="g-new" type="text" maxlength="50" placeholder="Ej. Documental" style="height: 46px; box-sizing: border-box; padding: 0 14px; border-radius: 10px; border: 1px solid #2B303B; background: #161920; color: #ECEEF2; font-size: 15px; font-family: inherit">
      </div>
      <button type="submit" style="height: 46px; padding: 0 20px; border-radius: 10px; border: 0; background: #F2A93B; color: #1B1306; font-weight: 600; font-size: 15px; font-family: inherit; display: flex; align-items: center; gap: 8px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>Añadir</button>
    </form>
    <div role="alert" style="display: flex; gap: 10px; align-items: flex-start; padding: 12px 16px; border-radius: 10px; background: #2A1714; border: 1px solid #5C2A24; color: #FFB4AB; font-size: 14px; line-height: 1.5">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: none; margin-top: 2px"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
      <span>No se puede eliminar «Drama»: está asociado a películas o series.</span>
    </div>
    <ul style="list-style: none; margin: 0; padding: 0; border: 1px solid #2B303B; border-radius: 14px; background: #161920; overflow: hidden">
      <li class="row" style="background: #1E222B">
        <label for="g-edit" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Editar género</label>
        <input id="g-edit" type="text" value="Ciencia-ficción" maxlength="50" style="flex: 1; min-width: 0; height: 40px; box-sizing: border-box; padding: 0 12px; border-radius: 8px; border: 1px solid #F2A93B; background: #0E1014; color: #ECEEF2; font-size: 15px; font-family: inherit">
        <button type="button" style="height: 40px; padding: 0 14px; border-radius: 8px; border: 0; background: #F2A93B; color: #1B1306; font-weight: 600; font-size: 14px; font-family: inherit">Guardar</button>
        <button type="button" style="height: 40px; padding: 0 14px; border-radius: 8px; border: 1px solid #2B303B; background: transparent; color: #ECEEF2; font-size: 14px; font-family: inherit">Cancelar</button>
      </li>
      <sc-for list="{{genres}}" as="g" hint-placeholder-count="7">
        <li class="row">
          <span style="flex: 1; font-size: 15px">{{g.name}}</span>
          <button type="button" class="ib" aria-label="{{g.editLabel}}"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg></button>
          <button type="button" class="ib" aria-label="{{g.deleteLabel}}" style="color: #FFB4AB"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"></path></svg></button>
        </li>
      </sc-for>
    </ul>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const genres = ['Aventura', 'Comedia', 'Drama', 'Misterio', 'Policíaco', 'Romance', 'Terror', 'Thriller'].map((name) => ({
      name, editLabel: 'Editar ' + name, deleteLabel: 'Eliminar ' + name
    }));
    return { genres };
  }
}
</script>
</body>
</html>
