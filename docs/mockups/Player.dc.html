<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Reproductor</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Sora:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#07080A}
a{color:#F2A93B}a:hover{color:#FFC56B}
.ctl{width:44px;height:44px;border-radius:10px;border:0;background:transparent;color:#ECEEF2;display:flex;align-items:center;justify-content:center}
.ctl:hover{background:rgba(255,255,255,0.08)}
.next:hover{background:#1E222B}
input[type=range]{accent-color:#F2A93B}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #F2A93B;outline-offset:2px}
</style>
</helmet>
<div style="min-height: 100vh; background: #07080A; color: #ECEEF2; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="display: flex; align-items: center; gap: 12px; padding: 16px 32px; border-bottom: 1px solid #1E222B">
    <a href="Detail.dc.html" style="display: flex; align-items: center; gap: 6px; min-height: 44px; color: #C9CED8; text-decoration: none; font-size: 15px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"></path></svg>La ruta del norte</a>
  </header>
  <div style="flex: 1; display: flex; flex-wrap: wrap; gap: 32px; padding: 28px 32px 48px; box-sizing: border-box; align-items: flex-start">
    <section aria-label="Vídeo" style="flex: 999 1 640px; min-width: 0; display: flex; flex-direction: column; gap: 20px">
      <div style="position: relative; aspect-ratio: 16 / 9; border-radius: 14px; overflow: hidden; background: #111318; border: 1px solid #1E222B; display: flex; flex-direction: column; justify-content: space-between">
        <div style="flex: 1; display: flex; align-items: center; justify-content: center">
          <button type="button" aria-label="Reproducir" style="width: 84px; height: 84px; border-radius: 50%; border: 0; background: #F2A93B; color: #1B1306; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="34" height="34" viewBox="0 0 24 24" fill="currentColor"><polygon points="8 5 20 12 8 19 8 5"></polygon></svg></button>
        </div>
        <div style="padding: 0 16px 12px; display: flex; flex-direction: column; gap: 6px; background: rgba(7,8,10,0.72)">
          <label for="seek" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Posición del vídeo</label>
          <input id="seek" type="range" min="0" max="3120" value="1010" style="width: 100%; margin: 10px 0 0">
          <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 4px">
            <button type="button" class="ctl" aria-label="Pausar"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14"></rect><rect x="14" y="5" width="4" height="14"></rect></svg></button>
            <button type="button" class="ctl" aria-label="Retroceder 10 segundos"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path><path d="M3 3v5h5"></path></svg></button>
            <button type="button" class="ctl" aria-label="Avanzar 10 segundos"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"></path><path d="M21 3v5h-5"></path></svg></button>
            <span style="font-size: 14px; color: #C9CED8; padding: 0 8px; font-variant-numeric: tabular-nums">16:50 / 52:00</span>
            <div style="flex: 1"></div>
            <button type="button" class="ctl" aria-label="Silenciar"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"></path></svg></button>
            <button type="button" class="ctl" aria-label="Pantalla completa"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"></path></svg></button>
          </div>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 14px; color: #A3ABB9">Temporada 1 · Episodio 1 · 52 min</span>
        <h1 style="margin: 0; font-family: Sora, sans-serif; font-size: 30px">Piloto</h1>
      </div>
    </section>
    <aside aria-labelledby="next-title" style="flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 12px">
      <h2 id="next-title" style="margin: 0; font-family: Sora, sans-serif; font-size: 18px">Siguientes episodios</h2>
      <ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px">
        <sc-for list="{{next}}" as="n" hint-placeholder-count="4">
          <li>
            <a href="Player.dc.html" class="next" style="display: flex; gap: 12px; align-items: center; padding: 10px; border-radius: 12px; text-decoration: none; color: #ECEEF2">
              <div style="width: 112px; aspect-ratio: 16 / 9; flex: none; border-radius: 8px; background: #1E222B; display: flex; align-items: center; justify-content: center; color: #A3ABB9"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="8 5 20 12 8 19 8 5"></polygon></svg></div>
              <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
                <span style="font-size: 13px; color: #A3ABB9">{{n.code}}</span>
                <span style="font-size: 15px; font-weight: 500">{{n.title}}</span>
                <span style="font-size: 13px; color: #A3ABB9">{{n.duration}}</span>
              </div>
            </a>
          </li>
        </sc-for>
      </ol>
    </aside>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const next = [
      ['T1 · E2', 'El paso helado', '48 min'],
      ['T1 · E3', 'Refugio', '50 min'],
      ['T1 · E4', 'La carta', '47 min'],
      ['T1 · E5', 'Tormenta', '55 min']
    ].map((n) => ({ code: n[0], title: n[1], duration: n[2] }));
    return { next };
  }
}
</script>
</body>
</html>
