<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mi cuenta</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Sora:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0E1014}
a{color:#F2A93B}a:hover{color:#FFC56B}
.nav{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:10px;color:#C9CED8;text-decoration:none;font-size:15px}
.nav:hover{background:#1E222B;color:#ECEEF2}
.nav-on{background:#2A2418;color:#F2A93B}
.field{display:flex;flex-direction:column;gap:8px;flex:1 1 240px;min-width:0}
.field label{font-size:14px;font-weight:500}
.field input{height:46px;box-sizing:border-box;padding:0 14px;border-radius:10px;border:1px solid #2B303B;background:#0E1014;color:#ECEEF2;font-size:15px;font-family:inherit}
input:focus,button:focus-visible,a:focus-visible{outline:2px solid #F2A93B;outline-offset:2px}
</style>
</helmet>
<div style="min-height: 100vh; display: flex; flex-wrap: wrap; background: #0E1014; color: #ECEEF2; font-family: Inter, system-ui, sans-serif">
  <nav aria-label="Principal" style="flex: 1 1 220px; max-width: 100%; box-sizing: border-box; padding: 24px 16px; background: #161920; border-right: 1px solid #2B303B; display: flex; flex-direction: column; gap: 6px">
    <div style="display: flex; align-items: center; gap: 10px; padding: 0 12px 20px">
      <div style="width: 32px; height: 32px; border-radius: 8px; background: #F2A93B; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1B1306" stroke-width="2.5" stroke-linejoin="round"><polygon points="7 4 20 12 7 20 7 4"></polygon></svg></div>
      <span style="font-family: Sora, sans-serif; font-weight: 700; font-size: 16px">MultimediaServer</span>
    </div>
    <a href="Catalog.dc.html" class="nav"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect></svg>Catálogo</a>
    <a href="Profile.dc.html" class="nav nav-on" aria-current="page"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 4-6 8-6s8 2 8 6"></path></svg>Mi cuenta</a>
    <div style="flex: 1"></div>
    <div style="display: flex; align-items: center; gap: 10px; padding: 12px; border-top: 1px solid #2B303B; margin-top: 16px">
      <div style="width: 36px; height: 36px; border-radius: 50%; background: #1E222B; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px">AN</div>
      <div style="display: flex; flex-direction: column; min-width: 0; flex: 1">
        <span style="font-size: 14px; font-weight: 600">ana</span>
        <span style="font-size: 12px; color: #A3ABB9">USER</span>
      </div>
      <a href="Main.dc.html" aria-label="Cerrar sesión" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 10px; color: #A3ABB9"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="M16 17l5-5-5-5M21 12H9"></path></svg></a>
    </div>
  </nav>
  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 32px 40px 56px; display: flex; flex-direction: column; gap: 24px; max-width: 980px">
    <header style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-family: Sora, sans-serif; font-size: 32px">Mi cuenta</h1>
      <p style="margin: 0; color: #A3ABB9; font-size: 15px">Actualiza tus datos personales y tus credenciales.</p>
    </header>
    <div role="status" style="display: flex; gap: 10px; align-items: center; padding: 12px 16px; border-radius: 10px; background: #142318; border: 1px solid #2D5A37; color: #A6E3B2; font-size: 14px">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg>
      <span>Datos guardados correctamente.</span>
    </div>
    <form style="display: flex; flex-direction: column; gap: 24px">
      <section aria-labelledby="personal-title" style="display: flex; flex-direction: column; gap: 18px; padding: 24px; border-radius: 14px; background: #161920; border: 1px solid #2B303B">
        <h2 id="personal-title" style="margin: 0; font-family: Sora, sans-serif; font-size: 19px">Datos personales</h2>
        <div style="display: flex; flex-wrap: wrap; gap: 16px">
          <div class="field"><label for="p-name">Nombre</label><input id="p-name" type="text" value="Ana"></div>
          <div class="field"><label for="p-last">Apellido</label><input id="p-last" type="text" value="García"></div>
        </div>
        <div class="field"><label for="p-email">Email</label><input id="p-email" type="email" value="ana@example.com"></div>
      </section>
      <section aria-labelledby="account-title" style="display: flex; flex-direction: column; gap: 18px; padding: 24px; border-radius: 14px; background: #161920; border: 1px solid #2B303B">
        <h2 id="account-title" style="margin: 0; font-family: Sora, sans-serif; font-size: 19px">Cuenta</h2>
        <div class="field">
          <label for="p-user">Nombre de usuario</label>
          <input id="p-user" type="text" value="ana" aria-describedby="p-user-hint">
          <span id="p-user-hint" style="font-size: 13px; color: #A3ABB9">Si lo cambias, tendrás que volver a iniciar sesión.</span>
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 16px">
          <div class="field"><label for="p-pass">Nueva contraseña</label><input id="p-pass" type="password" autocomplete="new-password" placeholder="Entre 8 y 72 caracteres"></div>
          <div class="field"><label for="p-pass2">Repite la contraseña</label><input id="p-pass2" type="password" autocomplete="new-password"></div>
        </div>
        <div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 10px; background: #0E1014; border: 1px dashed #2B303B">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A3ABB9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
          <div style="display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 14px; font-weight: 600">Rol: USER</span>
            <span style="font-size: 13px; color: #A3ABB9">Solo un administrador puede cambiar tu rol o eliminar tu cuenta.</span>
          </div>
        </div>
      </section>
      <div style="display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 12px">
        <button type="reset" style="height: 46px; padding: 0 20px; border-radius: 10px; border: 1px solid #2B303B; background: transparent; color: #ECEEF2; font-size: 15px; font-family: inherit">Descartar cambios</button>
        <button type="submit" style="height: 46px; padding: 0 22px; border-radius: 10px; border: 0; background: #F2A93B; color: #1B1306; font-weight: 600; font-size: 15px; font-family: inherit">Guardar cambios</button>
      </div>
    </form>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1050}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
